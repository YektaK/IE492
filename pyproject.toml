[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ie492-disaster-response"
version = "1.0.0"
description = "Sultanbeyli Disaster Response Container Location Selection — multi-criteria optimization system"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "pulp>=2.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "folium>=0.12.0",
    "plotly>=5.3.0",
    "streamlit>=1.10.0",
    "fpdf2>=2.5.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.0.9",
    "osmnx>=1.1.0",
    "networkx>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
